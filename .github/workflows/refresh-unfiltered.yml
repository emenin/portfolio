# Redeploys the site once a week so the Unfiltered section picks up new
# Substack posts without a code change. Needs a Netlify build hook URL stored
# as the NETLIFY_BUILD_HOOK repository secret.
name: Refresh Unfiltered posts

on:
  schedule:
    # Mondays at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        run: |
          if [ -z "${NETLIFY_BUILD_HOOK}" ]; then
            echo "NETLIFY_BUILD_HOOK secret is not set." >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST -d '{}' "${NETLIFY_BUILD_HOOK}"
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
